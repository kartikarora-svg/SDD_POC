# Podman Compose Configuration for Finalytics
# This is a Podman-optimized version of docker-compose.yml
# 
# Usage:
#   podman-compose up -d        # Start all services
#   podman-compose down          # Stop all services
#   podman-compose logs -f       # View logs
#   podman-compose ps            # List containers

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: finalytics-postgres
    environment:
      POSTGRES_USER: finalytics_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_change_me}
      POSTGRES_DB: finalytics
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finalytics_user -d finalytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - finalytics
    # Podman-specific: run as non-root user (more secure)
    userns_mode: "keep-id"

  # pgAdmin (Optional - for database GUI)
  # Uncomment to enable pgAdmin web interface
  # pgadmin:
  #   image: docker.io/dpage/pgadmin4:latest
  #   container_name: finalytics-pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@finalytics.local}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
  #     PGADMIN_CONFIG_SERVER_MODE: 'False'
  #   ports:
  #     - "${PGADMIN_PORT:-5050}:80"
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin:Z
  #   depends_on:
  #     - postgres
  #   restart: unless-stopped
  #   networks:
  #     - finalytics

volumes:
  postgres_data:
    driver: local
  # pgadmin_data:
  #   driver: local

networks:
  finalytics:
    driver: bridge

# Podman-specific notes:
# 1. :Z suffix on volumes enables SELinux relabeling (safe for Podman)
# 2. userns_mode: "keep-id" runs containers as current user (rootless)
# 3. Full image names (docker.io/library/postgres) avoid short-name warnings

